<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicSense Pro | Citizen Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-success mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🏙️ CivicSense Pro</span>
            <span class="navbar-text text-white">Smart Infrastructure Triage</span>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-lg mx-auto border-0" style="max-width: 500px; border-radius: 15px;">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-1">Report Road Damage</h4>
                <p class="text-muted text-center mb-4" style="font-size: 0.9em;">Upload an image to instantly alert municipal authorities.</p>
                
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="imageFile" class="form-label fw-bold">Select Image:</label>
                        <input class="form-control form-control-lg" type="file" id="imageFile" accept="image/jpeg, image/png" required>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold" id="submitBtn">
                        Submit Report
                    </button>
                </form>

                <div id="statusArea" class="mt-4 text-center d-none">
                    <div class="spinner-border text-success mb-2" id="loadingSpinner" role="status"></div>
                    <p class="text-success fw-bold" id="statusText">Uploading to server...</p>
                    
                    <img id="resultImg" class="img-fluid rounded shadow-sm mt-3 d-none" alt="AI Analysis Result">
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Set default variables
        let userLat = ""; 
        let userLng = ""; 

        // 2. Ask the web browser for the real physical location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    // If the user clicks "Allow", grab the real coordinates
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    console.log("📍 Real GPS Locked: " + userLat + ", " + userLng);
                },
                function(error) {
                    // If the user blocks location access, default to the city center
                    alert("Location access denied. Defaulting to Madurai city center.");
                    userLat = "9.9252";
                    userLng = "78.1198";
                }
            );
        } else {
            alert("Geolocation is not supported by this browser.");
        }

        // Listen for the user clicking the "Submit" button
        $('#uploadForm').on('submit', function(e) {
            // Stop the browser from refreshing the page!
            e.preventDefault(); 
            
            // Hide the button and show the loading spinner
            $('#submitBtn').addClass('d-none');
            $('#statusArea').removeClass('d-none');
            
            // Package the image and coordinates into a digital envelope
            let formData = new FormData();
            formData.append('file', $('#imageFile')[0].files[0]);
            formData.append('lat', userLat);
            formData.append('lng', userLng);

            // Send the envelope to the Flask server quietly in the background
            $.ajax({
                url: '/upload',
                type: 'POST',
                data: formData,
                processData: false, // Tell jQuery not to mess with the image file
                contentType: false, // Tell jQuery not to mess with the data format
                success: function(response) {
                    // 1. Hide the spinning circle
                    $('#loadingSpinner').addClass('d-none');
                    
                    // 2. Update the text to show success
                    $('#statusText').text('✅ ' + response.message);
                    
                    // 3. Inject the image URL sent from Flask into our empty <img> tag and reveal it!
                    $('#resultImg').attr('src', response.result_img_url).removeClass('d-none');
                    
                    // 4. Reset the submit button so they can file another report
                    $('#submitBtn').removeClass('d-none').text('Submit Another Report');
                    $('#uploadForm')[0].reset();
                },
                error: function() {
                    // This runs if the server crashes or is offline
                    alert("An error occurred while uploading the file.");
                    $('#submitBtn').removeClass('d-none');
                    $('#statusArea').addClass('d-none');
                }
            });
        });
    </script>
</body>
</html>
